name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -f backend/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    env:
      # Disposable CI-only accounts and database; never use these in a deployment.
      DB_PASSWORD: ci-database-password
      MYSQL_ROOT_PASSWORD: ci-root-database-password
      DEV_ADMIN_EMAIL: ci-admin@example.test
      DEV_ADMIN_PASSWORD: CI-admin-password-123
      E2E_ADMIN_EMAIL: ci-admin@example.test
      E2E_ADMIN_PASSWORD: CI-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose -p dvd-rental-ci -f compose.yml -f compose.dev.yml up --build -d --wait
      - run: npm --prefix frontend ci
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - if: always()
        run: docker compose -p dvd-rental-ci -f compose.yml -f compose.dev.yml down -v
